# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: https://render.com/deploy?repo=https://github.com/adhopte/eMRTD-Tester
services:
  - type: web
    name: emrtd-pid-issuer
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                 # sleeps after 15 min idle; switch to "starter" for always-on
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      # Public URL of the service; embedded in the committed test PKI (backend/data/pki)
      - key: PID_PUBLIC_BASE_URL
        value: https://emrtd-pid-issuer.onrender.com
      # Committed TEST keys baked into the image. For real keys use /etc/secrets (Secret Files).
      - key: PID_PKI_DIR
        value: /srv/data/pki
      - key: PID_ISSUER_COUNTRY
        value: EU
      - key: PID_REQUIRE_CSCA_TRUST
        value: "false"
      - key: PID_REQUIRE_CHIP_GENUINENESS
        value: "true"
