name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Default issuer URL baked into the APK; override with the repository variable ISSUER_URL
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon -PissuerUrl=${{ vars.ISSUER_URL || 'https://emrtd-pid-issuer.onrender.com' }}
      - run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/getyourid-wallet.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/getyourid-wallet-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: getyourid-wallet-apks
          path: android/app/build/outputs/getyourid-wallet*.apk
      # Publish the plain APK (not zipped) as a rolling pre-release for easy phone download
      - name: Remove APKs with the old app name from the pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in emrtd-pid-wallet.apk emrtd-pid-wallet-debug.apk; do
            gh release delete-asset dev-build "$f" -y --repo "${{ github.repository }}" || true
          done
      - name: Publish APK to the "dev-build" pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: getYourID Wallet — development build (latest push)
          prerelease: true
          make_latest: false
          body: |
            Build of `${{ github.sha }}` from `${{ github.ref_name }}`.
            Install **getyourid-wallet.apk** (release build, Android 8+). The -debug APK also allows plain-HTTP issuers on your LAN.
            Default issuer: ${{ vars.ISSUER_URL || 'https://emrtd-pid-issuer.onrender.com' }} (changeable in Settings).
            Signed with the public development key in android/keystore — updates install over earlier dev builds.
          files: |
            android/app/build/outputs/getyourid-wallet.apk
            android/app/build/outputs/getyourid-wallet-debug.apk
